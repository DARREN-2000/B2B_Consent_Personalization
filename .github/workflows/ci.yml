name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ─── Backend tests ──────────────────────────────────────────────────────────
  backend-test:
    name: Backend – Test & Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run pytest with coverage
        run: PYTHONPATH=. pytest --cov=app --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: backend/coverage.xml
          fail_ci_if_error: false

  # ─── Backend Docker build ────────────────────────────────────────────────────
  backend-docker:
    name: Backend – Docker Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: backend-test

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t consenthub/backend:ci ./backend

  # ─── Frontend Docker build ───────────────────────────────────────────────────
  frontend-docker:
    name: Frontend – Docker Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t consenthub/frontend:ci ./frontend

  # ─── Helm lint ───────────────────────────────────────────────────────────────
  helm-lint:
    name: Helm – Lint chart
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.0

      - name: Lint Helm chart
        run: helm lint helm/consenthub

      - name: Template Helm chart (dry-run)
        run: helm template consenthub helm/consenthub --debug
